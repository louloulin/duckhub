[package]
name = "duckhub-database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Core dependencies
duckhub-common = { path = "../common" }

# Async
tokio.workspace = true
tokio-stream = "0.1"
async-trait.workspace = true

# Database - Real DuckDB implementation (latest version)
duckdb = { version = "1.3.2", features = ["bundled", "modern-full"] }
redis.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Time and UUID
uuid.workspace = true
chrono.workspace = true

# Utilities
once_cell.workspace = true
dashmap.workspace = true
parking_lot.workspace = true

# Object storage (temporarily disabled due to compilation issues)
# # aws-sdk-s3.workspace = true
# # aws-config.workspace = true
# azure_storage.workspace = true
# azure_storage_blobs.workspace = true

# Data formats - Latest compatible versions with DuckDB 1.3.2
arrow = { version = "55.0", default-features = false, features = ["prettyprint", "ffi"] }
parquet = "55.0"

# Metrics
prometheus.workspace = true

# Encoding
base64 = "0.21"

[dev-dependencies]
tokio-test = "0.4"
tempfile.workspace = true
mockall.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ducklake_benchmarks"
harness = false
