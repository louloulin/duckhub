# Default configuration for DuckHub

[server]
host = "0.0.0.0"
port = 8080
workers = 4
keep_alive = 75
client_timeout = 5000
client_shutdown = 5000
max_connections = 25000
max_connection_rate = 256

[database]
duckdb_path = "data/duckhub.db"
memory_limit = "4GB"
threads = 4
extensions = [
    "httpfs",      # HTTP/S3 support for data lake access
    "parquet",     # Parquet file format support
    "delta",       # Delta Lake support
    "azure",       # Azure Blob Storage support
    "aws",         # AWS S3 enhanced support
    "json",        # Enhanced JSON support
    "fts",         # Full-text search
    "spatial"      # Spatial/GIS data support
]

[database.pool]
min_connections = 1
max_connections = 10
connection_timeout = 30
idle_timeout = 600
max_lifetime = 3600

[cache]
redis_url = "redis://localhost:6379"
pool_size = 10
connection_timeout = 5
default_ttl = 3600
max_key_size = 1024
max_value_size = 1048576

[storage]
data_path = "data"
temp_path = "tmp"
max_file_size = 1073741824

[storage.compression]
enabled = true
algorithm = "zstd"
level = 3

[logging]
level = "info"
format = "json"
output = "stdout"
structured = true

[security]
jwt_secret = "your-super-secret-jwt-key-change-this-in-production"
jwt_expiration = 86400
password_min_length = 8

[security.rate_limit]
enabled = true
requests_per_minute = 1000
burst_size = 100

[security.cors]
enabled = true
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["*"]
max_age = 3600

[features]
ai_agent = false
plugins = false
real_time = true
caching = true
metrics = true
tracing = true
