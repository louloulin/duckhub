[package]
name = "duckhub-ai-agent"
version = "0.1.0"
edition = "2021"
description = "AI Agent service for DuckHub financial data platform"

[dependencies]
# Core dependencies
duckhub-common = { path = "../../core/common" }
duckhub-database = { path = "../../core/database" }
duckhub-query-analytics = { path = "../query-analytics" }

# Rig AI framework
rig-core = "0.14.0"

# Vector storage for RAG (simplified implementation)
# Using simple in-memory vector storage for now

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Monitoring
prometheus = "0.13"

# Text processing
regex = "1.0"

# Configuration
config = "0.13"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Additional dependencies for Rig integration
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.0"
