[package]
name = "duckhub-ai-agent"
version = "0.1.0"
edition = "2021"
description = "AI Agent service for DuckHub financial data platform"

[dependencies]
# Core dependencies
duckhub-common = { path = "../../core/common" }
duckhub-database = { path = "../../core/database" }
duckhub-query-analytics = { path = "../query-analytics" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Monitoring
prometheus = "0.13"

# Text processing
regex = "1.0"

# Configuration
config = "0.13"

[dev-dependencies]
tempfile = "3.0"
