[package]
name = "duckhub-simple-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simple-api"
path = "simple_web_api.rs"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
