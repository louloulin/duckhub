# DuckHub API Gateway Kubernetes 部署配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckhub-api-gateway
  namespace: duckhub
  labels:
    app: duckhub-api-gateway
    component: api-gateway
    version: v1.0.0
    app.kubernetes.io/name: duckhub-api-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: duckhub
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: duckhub-api-gateway
  template:
    metadata:
      labels:
        app: duckhub-api-gateway
        component: api-gateway
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: duckhub-service-account
      priorityClassName: duckhub-high-priority
      
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      
      # 容器配置
      containers:
      - name: api-gateway
        image: duckhub/api-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        
        # 安全上下文
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # 端口配置
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # 环境变量
        env:
        - name: DUCKHUB_ENV
          value: "production"
        - name: DUCKHUB_LOG_LEVEL
          value: "info"
        - name: DUCKHUB_PORT
          value: "8080"
        - name: DUCKHUB_METRICS_PORT
          value: "9090"
        
        # 从 ConfigMap 读取配置
        - name: DUCKHUB_CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: duckhub-config
              key: cors_origins
        
        # 从 Secret 读取敏感信息
        - name: DUCKHUB_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: duckhub-secrets
              key: database_url
        - name: DUCKHUB_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: duckhub-secrets
              key: redis_url
        - name: DUCKHUB_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: duckhub-secrets
              key: jwt_secret
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: duckhub-secrets
              key: deepseek_api_key
        
        # 资源限制
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # 启动探针
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        
        # 卷挂载
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      
      # 卷配置
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: duckhub-config
      
      # 节点选择器
      nodeSelector:
        kubernetes.io/os: linux
      
      # 容忍度
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      # 亲和性
      affinity:
        # Pod 反亲和性 - 避免在同一节点上调度多个实例
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - duckhub-api-gateway
              topologyKey: kubernetes.io/hostname
        
        # 节点亲和性 - 优先选择高性能节点
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - high-performance
      
      # 终止宽限期
      terminationGracePeriodSeconds: 30
---
# Service 配置
apiVersion: v1
kind: Service
metadata:
  name: duckhub-api-gateway
  namespace: duckhub
  labels:
    app: duckhub-api-gateway
    component: api-gateway
    app.kubernetes.io/name: duckhub-api-gateway
    app.kubernetes.io/component: api-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: duckhub-api-gateway
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: duckhub-api-gateway-hpa
  namespace: duckhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: duckhub-api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: duckhub-api-gateway
  namespace: duckhub
  labels:
    app: duckhub-api-gateway
    component: api-gateway
spec:
  selector:
    matchLabels:
      app: duckhub-api-gateway
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true
---
# Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckhub-api-gateway
  namespace: duckhub
  labels:
    app: duckhub-api-gateway
    component: api-gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.duckhub.dev
    secretName: duckhub-api-tls
  rules:
  - host: api.duckhub.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: duckhub-api-gateway
            port:
              number: 80
