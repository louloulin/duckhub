[workspace]
resolver = "2"
members = [
    "crates/core/common",
    "crates/core/config",
    "crates/core/database",
    "crates/core/cache",
    "crates/core/security",
    "crates/services/auth",
    "crates/services/data-ingestion",
    "crates/services/data-processing",
    "crates/services/query-analytics",
    "crates/services/monitoring",
    "crates/tools/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DuckHub Team <team@duckhub.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/duckhub/financial-data-platform"
homepage = "https://duckhub.dev"
documentation = "https://docs.duckhub.dev"
keywords = ["finance", "data", "analytics", "duckdb", "rust"]
categories = ["database", "web-programming", "finance"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Web framework
actix-web = "4.4"
actix-cors = "0.7"

# Database
duckdb = { version = "0.8", features = ["bundled"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# AWS SDK
aws-config = "0.55"
aws-sdk-s3 = "0.28"
tracing-actix-web = "0.7"

# Async traits
async-trait = "0.1"

# UUID and time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Object storage
azure_storage = "0.19"
azure_storage_blobs = "0.19"

# Compression and formats (temporarily disabled due to arrow-arith conflicts)
# parquet = "48.0"
# arrow = "48.0"
# arrow-flight = "48.0"

# Metrics and monitoring
prometheus = "0.13"
metrics = "0.22"
metrics-prometheus = "0.6"

# Security
ring = "0.17"
argon2 = "0.5"
jsonwebtoken = "9.2"

# Utilities
once_cell = "1.19"
lazy_static = "1.4"
dashmap = "5.5"
parking_lot = "0.12"
url = "2.5"

# WASM runtime (for future plugin system)
wasmtime = "17.0"
wasmtime-wasi = "17.0"

# Testing
mockall = "0.12"
tempfile = "3.8"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "off"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.test]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1
